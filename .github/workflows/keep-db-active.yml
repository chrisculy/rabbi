name: Keep Supabase Database Active

# This workflow pings the Supabase database every 3 days to prevent it from
# being paused on the free tier. It performs a simple read-only query.
#
# REQUIRED GITHUB SECRETS:
# - POSTGRES_URL: The PostgreSQL connection string for your Supabase database
#   Format: postgres://user:password@host:port/database
#   You can find this in your Supabase project settings under "Database" > "Connection string"
#   Make sure to use the "Connection pooling" string if available for better performance.
#
# To add this secret:
# 1. Go to your GitHub repository
# 2. Navigate to Settings > Secrets and variables > Actions
# 3. Click "New repository secret"
# 4. Name: POSTGRES_URL
# 5. Value: Your Supabase connection string

on:
  # Run every 3 days at 2:00 AM UTC
  schedule:
    - cron: '0 2 */3 * *'
  
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pg library
        run: npm install pg
      
      - name: Ping Supabase Database
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          node << 'EOF'
          const { Client } = require('pg');
          
          async function pingDatabase() {
            const client = new Client({
              connectionString: process.env.POSTGRES_URL,
              ssl: { rejectUnauthorized: false }
            });
            
            try {
              console.log('Connecting to database...');
              await client.connect();
              console.log('Connected successfully!');
              
              // Simple read-only query to check database version
              const versionResult = await client.query('SELECT version()');
              console.log('Database version:', versionResult.rows[0].version);
              
              // Count tables in public schema
              const tableResult = await client.query(
                "SELECT COUNT(*) as table_count FROM information_schema.tables WHERE table_schema = 'public'"
              );
              console.log('Tables in public schema:', tableResult.rows[0].table_count);
              
              console.log('Successfully pinged database at', new Date().toISOString());
              
              await client.end();
              process.exit(0);
            } catch (error) {
              console.error('Failed to connect to database:', error.message);
              process.exit(1);
            }
          }
          
          pingDatabase();
          EOF
